# ContaNova — solo gateway WhatsApp (Baileys).
# La API CRUD sigue en Vercel; el frontend en Firebase Hosting.
# Baileys requiere proceso Node persistente (no serverless).

services:
  - type: web
    name: contanova-whatsapp
    runtime: node
    region: oregon
    plan: free
    rootDir: artifacts/whatsapp-server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: WA_DELAY_MIN_MS
        value: "4000"
      - key: WA_DELAY_MAX_MS
        value: "9000"
      - key: WA_SESSION_ID
        value: production
      - key: LOG_LEVEL
        value: info
