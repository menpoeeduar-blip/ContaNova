openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ContaNova ERP API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard & KPIs
  - name: clientes
    description: Clientes
  - name: proveedores
    description: Proveedores
  - name: productos
    description: Productos e inventario
  - name: facturas
    description: Facturas de venta
  - name: compras
    description: Ordenes y facturas de compra
  - name: cartera
    description: Cuentas por cobrar y pagar
  - name: cuentas
    description: Plan de cuentas contables
  - name: movimientos
    description: Movimientos contables / comprobantes
  - name: crm
    description: CRM y oportunidades
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── DASHBOARD ───────────────────────────────────────────────────────────────
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: KPIs ejecutivos del dashboard
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/ventas-mensuales:
    get:
      operationId: getVentasMensuales
      tags: [dashboard]
      summary: Ventas por mes (últimos 12 meses)
      responses:
        "200":
          description: Ventas mensuales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VentaMensual"

  /dashboard/top-productos:
    get:
      operationId: getTopProductos
      tags: [dashboard]
      summary: Productos más vendidos
      responses:
        "200":
          description: Top productos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopProducto"

  /dashboard/actividad-reciente:
    get:
      operationId: getActividadReciente
      tags: [dashboard]
      summary: Actividad reciente del sistema
      responses:
        "200":
          description: Actividad reciente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActividadItem"

  /dashboard/flujo-caja:
    get:
      operationId: getFlujoCaja
      tags: [dashboard]
      summary: Flujo de caja (últimos 30 días)
      responses:
        "200":
          description: Flujo de caja
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlujoCajaItem"

  # ─── CLIENTES ────────────────────────────────────────────────────────────────
  /clientes:
    get:
      operationId: listClientes
      tags: [clientes]
      summary: Listar clientes
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: activo
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Lista de clientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cliente"
    post:
      operationId: createCliente
      tags: [clientes]
      summary: Crear cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClienteInput"
      responses:
        "201":
          description: Cliente creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cliente"

  /clientes/{id}:
    get:
      operationId: getCliente
      tags: [clientes]
      summary: Obtener cliente por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cliente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cliente"
        "404":
          description: No encontrado
    patch:
      operationId: updateCliente
      tags: [clientes]
      summary: Actualizar cliente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClienteUpdate"
      responses:
        "200":
          description: Cliente actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cliente"
    delete:
      operationId: deleteCliente
      tags: [clientes]
      summary: Eliminar cliente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Eliminado

  /clientes/{id}/resumen:
    get:
      operationId: getClienteResumen
      tags: [clientes]
      summary: Resumen de cuenta del cliente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resumen del cliente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClienteResumen"

  # ─── PROVEEDORES ─────────────────────────────────────────────────────────────
  /proveedores:
    get:
      operationId: listProveedores
      tags: [proveedores]
      summary: Listar proveedores
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Lista de proveedores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Proveedor"
    post:
      operationId: createProveedor
      tags: [proveedores]
      summary: Crear proveedor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProveedorInput"
      responses:
        "201":
          description: Proveedor creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proveedor"

  /proveedores/{id}:
    get:
      operationId: getProveedor
      tags: [proveedores]
      summary: Obtener proveedor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Proveedor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proveedor"
    patch:
      operationId: updateProveedor
      tags: [proveedores]
      summary: Actualizar proveedor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProveedorUpdate"
      responses:
        "200":
          description: Proveedor actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proveedor"
    delete:
      operationId: deleteProveedor
      tags: [proveedores]
      summary: Eliminar proveedor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Eliminado

  # ─── PRODUCTOS ───────────────────────────────────────────────────────────────
  /productos:
    get:
      operationId: listProductos
      tags: [productos]
      summary: Listar productos
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: categoria
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Lista de productos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Producto"
    post:
      operationId: createProducto
      tags: [productos]
      summary: Crear producto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductoInput"
      responses:
        "201":
          description: Producto creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"

  /productos/{id}:
    get:
      operationId: getProducto
      tags: [productos]
      summary: Obtener producto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Producto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
    patch:
      operationId: updateProducto
      tags: [productos]
      summary: Actualizar producto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductoUpdate"
      responses:
        "200":
          description: Producto actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
    delete:
      operationId: deleteProducto
      tags: [productos]
      summary: Eliminar producto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Eliminado

  /productos/stats/inventario:
    get:
      operationId: getInventarioStats
      tags: [productos]
      summary: Estadisticas de inventario (bajo stock, total valor)
      responses:
        "200":
          description: Stats inventario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventarioStats"

  # ─── FACTURAS ────────────────────────────────────────────────────────────────
  /facturas:
    get:
      operationId: listFacturas
      tags: [facturas]
      summary: Listar facturas de venta
      parameters:
        - name: estado
          in: query
          schema:
            type: string
            enum: [borrador, emitida, pagada, anulada]
        - name: clienteId
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Lista de facturas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Factura"
    post:
      operationId: createFactura
      tags: [facturas]
      summary: Crear factura
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacturaInput"
      responses:
        "201":
          description: Factura creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Factura"

  /facturas/{id}:
    get:
      operationId: getFactura
      tags: [facturas]
      summary: Obtener factura
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Factura con items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacturaDetalle"
    patch:
      operationId: updateFactura
      tags: [facturas]
      summary: Actualizar factura
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacturaUpdate"
      responses:
        "200":
          description: Factura actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Factura"
    delete:
      operationId: deleteFactura
      tags: [facturas]
      summary: Anular/eliminar factura
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Eliminado

  /facturas/stats/resumen:
    get:
      operationId: getFacturasResumen
      tags: [facturas]
      summary: Resumen de facturas (totales por estado)
      responses:
        "200":
          description: Resumen facturas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacturasResumen"

  # ─── COMPRAS ─────────────────────────────────────────────────────────────────
  /compras:
    get:
      operationId: listCompras
      tags: [compras]
      summary: Listar órdenes y facturas de compra
      parameters:
        - name: estado
          in: query
          schema:
            type: string
            enum: [pendiente, recibida, pagada, anulada]
        - name: proveedorId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Lista de compras
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Compra"
    post:
      operationId: createCompra
      tags: [compras]
      summary: Crear orden/factura de compra
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompraInput"
      responses:
        "201":
          description: Compra creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Compra"

  /compras/{id}:
    get:
      operationId: getCompra
      tags: [compras]
      summary: Obtener compra
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Compra con detalle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompraDetalle"
    patch:
      operationId: updateCompra
      tags: [compras]
      summary: Actualizar compra
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompraUpdate"
      responses:
        "200":
          description: Compra actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Compra"
    delete:
      operationId: deleteCompra
      tags: [compras]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Eliminado

  # ─── CARTERA ─────────────────────────────────────────────────────────────────
  /cartera/cuentas-cobrar:
    get:
      operationId: listCuentasCobrar
      tags: [cartera]
      summary: Cuentas por cobrar pendientes
      parameters:
        - name: vencidas
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Cuentas por cobrar
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CuentaCobrar"

  /cartera/cuentas-pagar:
    get:
      operationId: listCuentasPagar
      tags: [cartera]
      summary: Cuentas por pagar pendientes
      parameters:
        - name: vencidas
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Cuentas por pagar
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CuentaPagar"

  /cartera/stats:
    get:
      operationId: getCarteraStats
      tags: [cartera]
      summary: Resumen de cartera (total por cobrar/pagar, vencidos)
      responses:
        "200":
          description: Stats de cartera
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarteraStats"

  /cartera/abonos:
    post:
      operationId: createAbono
      tags: [cartera]
      summary: Registrar abono a factura
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbonoInput"
      responses:
        "201":
          description: Abono registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Abono"

  # ─── PLAN DE CUENTAS ─────────────────────────────────────────────────────────
  /cuentas:
    get:
      operationId: listCuentas
      tags: [cuentas]
      summary: Listar plan de cuentas
      parameters:
        - name: tipo
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Plan de cuentas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CuentaContable"
    post:
      operationId: createCuenta
      tags: [cuentas]
      summary: Crear cuenta contable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CuentaContableInput"
      responses:
        "201":
          description: Cuenta creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CuentaContable"

  /cuentas/{id}:
    patch:
      operationId: updateCuenta
      tags: [cuentas]
      summary: Actualizar cuenta contable
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CuentaContableUpdate"
      responses:
        "200":
          description: Cuenta actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CuentaContable"
    delete:
      operationId: deleteCuenta
      tags: [cuentas]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Eliminado

  # ─── MOVIMIENTOS CONTABLES ────────────────────────────────────────────────────
  /movimientos:
    get:
      operationId: listMovimientos
      tags: [movimientos]
      summary: Listar comprobantes contables
      parameters:
        - name: tipo
          in: query
          schema:
            type: string
        - name: fechaDesde
          in: query
          schema:
            type: string
            format: date
        - name: fechaHasta
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Lista de movimientos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Movimiento"
    post:
      operationId: createMovimiento
      tags: [movimientos]
      summary: Crear comprobante contable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovimientoInput"
      responses:
        "201":
          description: Movimiento creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movimiento"

  /movimientos/{id}:
    get:
      operationId: getMovimiento
      tags: [movimientos]
      summary: Obtener movimiento contable
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Movimiento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movimiento"
    delete:
      operationId: deleteMovimiento
      tags: [movimientos]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Eliminado

  # ─── CRM ─────────────────────────────────────────────────────────────────────
  /crm/oportunidades:
    get:
      operationId: listOportunidades
      tags: [crm]
      summary: Listar oportunidades CRM
      parameters:
        - name: etapa
          in: query
          schema:
            type: string
            enum: [prospecto, calificado, propuesta, negociacion, ganado, perdido]
      responses:
        "200":
          description: Lista de oportunidades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Oportunidad"
    post:
      operationId: createOportunidad
      tags: [crm]
      summary: Crear oportunidad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OportunidadInput"
      responses:
        "201":
          description: Oportunidad creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Oportunidad"

  /crm/oportunidades/{id}:
    patch:
      operationId: updateOportunidad
      tags: [crm]
      summary: Actualizar oportunidad
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OportunidadUpdate"
      responses:
        "200":
          description: Oportunidad actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Oportunidad"
    delete:
      operationId: deleteOportunidad
      tags: [crm]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Eliminado

  /crm/stats:
    get:
      operationId: getCrmStats
      tags: [crm]
      summary: Estadisticas CRM (pipeline, conversion, valor total)
      responses:
        "200":
          description: Stats CRM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrmStats"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ─── DASHBOARD ───────────────────────────────────────────────────────────
    DashboardStats:
      type: object
      required:
        - ventasHoy
        - ventasMes
        - utilidadMes
        - totalClientes
        - totalProductos
        - facturasPendientes
        - cuentasPorCobrar
        - cuentasPorPagar
        - oportunidadesAbiertas
      properties:
        ventasHoy:
          type: number
        ventasMes:
          type: number
        utilidadMes:
          type: number
        totalClientes:
          type: integer
        totalProductos:
          type: integer
        facturasPendientes:
          type: integer
        cuentasPorCobrar:
          type: number
        cuentasPorPagar:
          type: number
        oportunidadesAbiertas:
          type: integer
        variacionVentasMes:
          type: ["number", "null"]

    VentaMensual:
      type: object
      required: [mes, total, cantidad]
      properties:
        mes:
          type: string
        total:
          type: number
        cantidad:
          type: integer

    TopProducto:
      type: object
      required: [productoId, nombre, cantidadVendida, totalVentas]
      properties:
        productoId:
          type: integer
        nombre:
          type: string
        cantidadVendida:
          type: number
        totalVentas:
          type: number

    ActividadItem:
      type: object
      required: [id, tipo, descripcion, fecha]
      properties:
        id:
          type: integer
        tipo:
          type: string
        descripcion:
          type: string
        fecha:
          type: string
        monto:
          type: ["number", "null"]

    FlujoCajaItem:
      type: object
      required: [fecha, ingresos, egresos, saldo]
      properties:
        fecha:
          type: string
        ingresos:
          type: number
        egresos:
          type: number
        saldo:
          type: number

    # ─── CLIENTES ─────────────────────────────────────────────────────────────
    Cliente:
      type: object
      required:
        - id
        - nombre
        - tipoDocumento
        - numeroDocumento
        - activo
        - createdAt
      properties:
        id:
          type: integer
        nombre:
          type: string
        tipoDocumento:
